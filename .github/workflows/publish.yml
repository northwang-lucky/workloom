name: Publish npm packages

# 打 v* tag 触发发布。两个 workspace 包同版本，tag 形如 v1.0.0。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # core 的部分测试会在临时仓库里 commit，CI runner 默认没有 git 身份。
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # dist 随源码入库，发布产物就是仓库里的 dist。这里拦住未重建就打 tag 的情况。
      - name: Verify committed dist is up to date
        run: git diff --exit-code -- packages/core/dist packages/dsh-workloom/dist

      # tag 版本必须与两个包版本一致，避免发出错版。
      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core/package.json packages/dsh-workloom/package.json; do
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('$pkg','utf8')).version")
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "Tag version $TAG_VERSION does not match $pkg version $VERSION"
              exit 1
            fi
          done

      # 根 CHANGELOG.md 是唯一事实源。复制到包目录才能进 npm 包，产物不入库。
      - name: Distribute changelog to packages
        run: |
          cp CHANGELOG.md packages/core/CHANGELOG.md
          cp CHANGELOG.md packages/dsh-workloom/CHANGELOG.md

      # pnpm -r 按依赖拓扑顺序发布，core 先于 dsh-workloom。
      # workspace:* 在发布时由 pnpm 替换成真实版本号。
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node .agents/skills/npm-publish/scripts/extract-changelog.mjs "$VERSION" > /tmp/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          fi
