# workloom configuration — all values have sensible defaults; override only what you need.
#
# packages maps a package name to its repo-relative path; spec scope injection
# collects only indexes declared here.
packages:
  core:
    path: packages/core
  assets:
    path: packages/assets
  adapter-dsh:
    path: packages/adapter-dsh
  adapter-pi:
    path: packages/adapter-pi
  repo:
    path: .

# subagents maps an executor kind (research/implement/check) to default model/effort
# for workloom_execute-dispatched subagents. A tool call's explicit model/effort wins
# over these defaults; each field is merged independently, so a missing field falls
# back to the value here. Kinds are not whitelisted, and any entry must be an object
# whose model/effort are strings. Uncomment to enable.

subagents:
  research:
    model: deepseek-v4-flash-vision-exp
    effort: high
  implement:
    model: deepseek-v4-flash-vision-exp
    effort: max
  check:
    model: kimi-coding/k3
    effort: high
