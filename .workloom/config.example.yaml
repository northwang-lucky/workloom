# workloom configuration reference — EXAMPLE ONLY, documentation, not a config.
#
# loadConfig reads only `.workloom/config.yaml` plus the optional gitignored
# `.workloom/config.local.yaml`; this file is never consumed. Keep the
# authoritative field explanations here and the effective values in
# config.yaml.
#
# config.local.yaml deep-merges over config.yaml: maps merge recursively key by
# key, arrays and scalars replace the whole value. Use it for per-machine
# overrides only.
#
# The effective values shown below mirror this repository's config.yaml.

# Commit message used by the journal recorder (default shown; uncomment to
# override).
# session_commit_message: "chore: record journal"

# Maximum journal lines kept per session.
# max_journal_lines: 2000

# Auto-commit the journal after each session.
# session_auto_commit: true

# Context-injection caps: how much spec/research context is inlined per turn.
# context_injection:
#   max_file_bytes: 32768
#   max_artifact_bytes: 65536
#   max_total_bytes: 131072

# prompt_injection.skip_keyword is the escape hatch: a user message containing
# this keyword skips breadcrumb injection for that turn.
# prompt_injection:
#   skip_keyword: "no-workloom"

# hooks run shell commands with TASK_JSON_PATH pointing at task.json.
# hooks:
#   after_create:
#     - echo task created
#   after_start:
#     - echo task started
#   after_finish:
#     - echo task finished
#   after_archive:
#     - echo task archived

# packages maps a package name to its repo-relative path; the spec-index scope
# collects only packages declared here (every package when the map is empty).
# `type` and `git` are optional annotations:
#   packages:
#     assets:
#       path: packages/assets
#       type: plugin
#       git: true
packages:
  core:
    path: packages/core
  assets:
    path: packages/assets
  adapter-dsh:
    path: packages/adapter-dsh
  adapter-pi:
    path: packages/adapter-pi
  repo:
    path: .

# default_package names the default package declared in packages; omit for none.
# default_package: core

# subagents.<kind> sets default model/effort for workloom_execute-dispatched
# subagents (research/implement/check; keys are not whitelisted). A tool call's
# explicit model/effort wins; each field merges independently, so a missing
# field falls back to the value here.
#
# `effort` (low/medium/high/xhigh/max) only takes effect on the Pi adapter
# (mapped to --thinking); the DSH adapter ignores this field.
#
# `model` accepts either a single string (the same value on every runtime) or a
# per-runtime map with one entry per runtime key (dsh/pi, plus any future
# runtime — keys are not whitelisted). With a map, the entry for the current
# runtime must exist: a missing key fails loudly with its field path (e.g.
# "subagents.implement.model.dsh") instead of silently spawning the wrong model.
# A `provider/` prefix (e.g. "deepseek-official/deepseek-v4-flash") routes the
# subagent to that provider — cross-provider dispatch must carry the prefix;
# a bare id falls back to the session's own provider. Map form:
#   subagents:
#     research:
#       model:
#         dsh: deepseek-official/deepseek-v4-flash
#         pi: deepseek/deepseek-v4-flash
#       effort: high
subagents:
  research:
    model: deepseek-official/deepseek-v4-flash-vision-exp
    effort: high
  implement:
    model: deepseek-official/deepseek-v4-flash-vision-exp
    effort: max
  check:
    model: qwen-token-plan-cn/qwen3.8-max
    effort: medium

# subagent_profiles tiers the subagents block above by the main session's
# current model: entries are matched top-down, and the FIRST entry whose
# `whenMain` condition matches wins. It coexists with the legacy `subagents`
# block (the default layer): fields of the winning entry win over
# `subagents.<kind>`, and each field merges independently — explicit tool args
# > subagent_profiles entry > subagents.<kind> > parent session.
#
# `whenMain` is either a full "provider/model" string (matched on every runtime)
# or a per-runtime map (e.g. `{ dsh: ..., pi: ... }`, matched by the current
# runtime key; a missing key just skips that entry). An entry WITHOUT whenMain
# is the unconditional fallback — at most one is allowed (duplicates fail
# loudly), and overlapping whenMain conditions between entries also fail loudly
# at load time (with the conflicting runtime and value). A malformed whenMain
# value (missing "/" or an empty side) is rejected at load time. If the main
# session model cannot be read, all whenMain entries are skipped (fallback /
# legacy subagents apply). When subagent_profiles is absent or empty, behavior
# is identical to the legacy subagents-only layout. Example:
#   subagent_profiles:
#     - whenMain: kimi-coding/k3
#       subagents:
#         research:
#           model: deepseek-v4-flash
#           effort: high
#     - whenMain:
#         dsh: deepseek-official/deepseek-v4-pro
#         pi: deepseek/deepseek-v4-pro
#       subagents:
#         implement:
#           effort: max
#     - subagents:
#         check:
#           model: qwen-token-plan-cn/qwen3.8-max

# prompt local extensions: per-machine prompt fragments (gitignored, not part of
# the repo). They are appended as extra discipline text — the main agent gets an
# "all.md + main.md" synthesis at the end of its session-context snapshot, and
# each dispatched executor gets "all.md + <kind>.md" in its first prompt.
#
# Directory convention: .workloom/prompts.local/ (add "prompts.local/" to
# .workloom/.gitignore). Legal file names: main.md, research.md, implement.md,
# check.md, frontend.md, all.md — any other .md name fails loudly with the legal
# list; non-.md files are ignored; a missing directory means no fragments at
# all (zero behaviour).
#
# Fragment format: Markdown body with an optional YAML front-matter block
# (--- delimited) at the top. The only allowed field is `requiresTools`, a list
# of tool names with AND semantics — the fragment is injected only when EVERY
# declared tool is in the runtime's available tool set. An empty/missing
# requiresTools means unconditional. Invalid YAML, unknown fields, or a
# non-string-array requiresTools fail loudly (same policy as config.yaml).
#
# Typical use: upgrade the built-in soft LSP baseline into a hard constraint on
# a machine that has the LSP tooling installed. The fragments below are an
# example written for DSH with dsh-lsp-actions; the tool names and the exposed
# set vary by runtime and machine configuration, and requiresTools only gates on
# tools the runtime actually exposes (on Pi, keep the wording scenario-based
# instead of naming tools). Shared naming table: lsp_symbols / lsp_signature /
# lsp_completion / lsp_rename / lsp_code_action / lsp_diagnostics (hard), plus
# lsp_format / lsp_inlay_hints marked "as needed".
#   main.md:
#     You MUST lean on LSP tooling on this machine: use lsp_symbols /
#     lsp_signature to orient before touching code, lsp_completion /
#     lsp_code_action to resolve details and fixes, lsp_rename for renames
#     instead of textual search, and include an lsp_diagnostics check in the
#     verification pass of every task. lsp_format / lsp_inlay_hints: as needed.
#   implement.md:
#     ---
#     requiresTools: [lsp_diagnostics]
#     ---
#     You MUST use LSP tooling while implementing on this machine:
#     lsp_symbols / lsp_signature / lsp_completion for structure and APIs,
#     lsp_rename for every symbol rename (never textual find-replace),
#     lsp_code_action for quick-fixes, and lsp_diagnostics after each edit; the
#     final report MUST include the lsp_diagnostics verification result.
#     lsp_format / lsp_inlay_hints: as needed.
#   check.md / frontend.md:
#     ---
#     requiresTools: [lsp_diagnostics]
#     ---
#     Same recipe per role: check leans on lsp_code_action + lsp_diagnostics and
#     reports the result; frontend takes the implement subset for its
#     verification pass. Both mark lsp_format / lsp_inlay_hints "as needed".
#
# Composed text is injected outside the context_injection budget (discipline
# text is small and must take full effect). workloom_doctor lists every loaded
# fragment (target, condition, source file) and the reason skipped ones are not
# injected.
